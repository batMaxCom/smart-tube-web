server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # API и DASH-манифесты уходят на backend
    location /api/ {
        proxy_pass http://server:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Передача медиа-сегментов (долгие ответы)
    location /api/v1/stream {
        proxy_pass http://server:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Service worker и манифест нельзя кэшировать надолго (частая проверка обновлений)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        default_type application/javascript;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # Собранные ассеты (хешированные имена) — кэш эффективный
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri /index.html;
    }

    # SPA: все остальные пути → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/plain;
    gzip_min_length 1024;
}